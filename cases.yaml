# MPAS IC factory case definitions (GSL init_atmosphere code and namelists).
#
# Each case produces, under <outdir>/<case_dir>/case_files/:
#   mpas.<domain>.<resolution>.static.nc
#   mpas.<domain>.<resolution>.ugwp_oro_data.nc
#   mpas.<domain>.<resolution>.<source>.init.<date>.nc
#   mpas.<domain>.<resolution>.<source>.lbc.<date>.nc        (conus only)
#   mpas.<domain>.<resolution>.<source>.sfc_update.<date>.nc (gfs only)
# with <case_dir> = <domain>.<resolution>.<source>.<yyyymmddhh>

# Repository that builds init_atmosphere_model (workflow inputs can override).
code:
  repo: ufs-community/MPAS-Model
  ref: noaa/develop

# Initial times of the input data. "season" picks the rap date.
dates:
  gfs: "2023031015"
  rap:
    winter: "2024020218"
    summer: "2024081518"

# Mesh file stem per domain and resolution: <stem>.grid.nc and <stem>.graph.info
# must be in the grids input bundle.
meshes:
  global:
    120km: x1.40962
  conus:
    120km: conus.120km

# Case ids follow barlage/mpas_testcase create_mpas_testcase_case05..08.sh.
cases:
  case05: {domain: conus,  resolution: 120km, source: gfs}
  case06: {domain: global, resolution: 120km, source: gfs}
  case07: {domain: conus,  resolution: 120km, source: rap, season: winter}
  case08: {domain: conus,  resolution: 120km, source: rap, season: summer}

# Defaults applied to every case unless the case sets them.
defaults:
  use_climo_aerosols: true
